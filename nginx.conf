events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;


    server {
        listen 80;  # 80번 포트의 요청
        server_name localhost;  # localhost로 접속한다면 해당 설정을 적용

        root /var/www/html;  
        index index.php index.html index.htm;  # 접속 시 뜨게 될 파일들

        location / { 
            try_files $uri $uri/ /index.php?$query_string;  # 리소스가 없다면 404가 아닌 index.php로 요청을 넘긴다.
        }

        location ~ \.php$ {
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            include fastcgi_params;
        }
    }
}
