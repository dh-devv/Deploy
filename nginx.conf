events {
    worker_connections 1024;
}

http {
    map $request_method $auth_limit_key {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $auth_limit_key zone=auth:1m rate=10r/s;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;


    server {
        listen 80;  # 80번 포트의 요청
        server_name localhost;  # localhost로 접속한다면 해당 설정을 적용

        root /var/www/html;  
        client_max_body_size 4m;
        server_tokens off;
        index index.php index.html index.htm;  # 접속 시 뜨게 될 파일들

        location / { 
            try_files $uri $uri/ /index.php?$query_string;  # 리소스가 없다면 404가 아닌 index.php로 요청을 넘긴다.
        }

        location ^~ /config/ { return 403; }
        location ^~ /lib/ { return 403; }
        location ~ /\. { return 403; }

        location ^~ /uploads/ {
            if ($uri !~* "^/uploads/[a-f0-9-]+[.](jpg|jpeg|png|gif|webp|pdf|txt)$") { return 403; }
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Disposition attachment always;
        }

        location = /auth.php {
            limit_req zone=auth burst=40 nodelay;
            limit_req_status 429;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/auth.php;
            fastcgi_pass php:9000;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            include fastcgi_params;
        }
    }
}
