services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: board_test
      MYSQL_USER: board_test
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.test}
      MYSQL_ROOT_PASSWORD: ${TEST_ROOT_PASSWORD:?Set TEST_ROOT_PASSWORD in .env.test}
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./tests/fixtures.sql:/docker-entrypoint-initdb.d/test-fixtures.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
  php:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: board_test
      DB_USER: board_test
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.test}
    volumes:
      - ${BOARD_SOURCE:-./src}:/var/www/html:ro
      - ./.local-tests/uploads:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy
  nginx:
    image: nginx:latest
    ports:
      - "127.0.0.1:18082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${BOARD_SOURCE:-./src}:/var/www/html:ro
      - ./.local-tests/uploads:/var/www/html/uploads:ro
    depends_on:
      - php
