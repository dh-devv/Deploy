services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: board-app-container
    env_file:
      - ./.env
    volumes:
      - ./src:/var/www/html:ro
      - ./src/uploads:/var/www/html/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
  
  nginx:
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "127.0.0.1:${HTTP_PORT:-8082}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src:/var/www/html:ro
    depends_on:
      - php
